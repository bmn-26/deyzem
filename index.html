<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teyzem için</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd27a;--cream:#fff4ec}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(#3a0c27,#7d2447 60%,#b83b5e) fixed;color:var(--cream);font-family:Caveat,'Bradley Hand','Segoe Script',cursive}
main{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px calc(env(safe-area-inset-bottom,0px) + 30px);text-align:center}
h1{font-size:clamp(54px,16vw,88px);color:var(--gold);margin:0;line-height:1}
.sub{font-size:28px;margin:8px 0 26px}
.card{display:flex;align-items:center;gap:16px;width:100%;margin:0 0 14px;padding:16px 18px;text-align:left;color:inherit;font:inherit;text-decoration:none;border-radius:26px;border:1.5px solid rgba(255,210,122,.4);background:rgba(255,255,255,.08);cursor:pointer;transition:transform .2s,background .2s}
.card:hover,.card:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.16);outline:none}
.card:focus-visible{border-color:#fff}
.card:active{transform:scale(.98)}
.ic{font-size:54px;flex:none}
.card b{display:block;font-size:36px;color:var(--gold);line-height:1;margin-bottom:4px}
.card span{font-size:25px;line-height:1.1}
.foot{font-size:30px;margin-top:24px}
.fl{position:fixed;bottom:-40px;opacity:.45;pointer-events:none;animation:up linear infinite}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg)}}
#fal{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:rgba(40,8,28,.92)}
#fal.on{display:flex}
#cup{font-size:120px;background:none;border:0;cursor:pointer;line-height:1}
#cup.sh{animation:sh .25s 5}
@keyframes sh{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
#ft{font-size:clamp(28px,7vw,38px);line-height:1.2;max-width:440px;min-height:130px;margin:10px 0 18px;color:var(--gold)}
.go{font:inherit;font-size:30px;padding:8px 34px;border:0;border-radius:40px;background:var(--gold);color:#3a0c27;cursor:pointer;margin:4px}
.go.s{background:transparent;color:var(--cream);border:2px solid var(--cream);font-size:26px}
@media (prefers-reduced-motion:reduce){.fl{display:none}.card{transition:none}}
.card.gold{border-color:var(--gold);background:rgba(255,210,122,.14)}
.card.gold b{font-size:30px;line-height:1.05}
#mir{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#7d2447,#2c0a24 75%)}
#mir.on{display:flex}
.mf{position:relative;width:min(78vw,330px);aspect-ratio:3/4;margin-top:34px}
.mf::before{content:"👑";position:absolute;top:-52px;left:0;right:0;font-size:56px;line-height:1;z-index:2}
.mf .rim{position:absolute;inset:0;border-radius:50%;padding:8px;background:conic-gradient(from 30deg,#fff1c2,#d9a43a,#fff1c2,#b8801f,#fff1c2,#d9a43a,#fff1c2);box-shadow:0 0 40px rgba(255,210,122,.55)}.mf .rim::after{content:"";position:absolute;inset:8px;border-radius:50%;box-shadow:0 0 0 2px #8a5d16;pointer-events:none;z-index:1}
.lens{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;clip-path:ellipse(50% 50% at 50% 50%);-webkit-clip-path:ellipse(50% 50% at 50% 50%);transform:translateZ(0);background:#1b0615}.lens::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 22px #000a;pointer-events:none}.mf video{display:block;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.sp{position:absolute;font-size:26px;animation:tw 2.4s ease-in-out infinite;z-index:2}
@keyframes tw{50%{transform:scale(1.4) rotate(15deg);opacity:.5}}
#mcap{white-space:pre-line;font-size:clamp(30px,8vw,42px);line-height:1.15;color:var(--gold);max-width:420px;min-height:100px;margin:22px 0 12px}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
.mf canvas{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(255,210,122,.55))}
#mvid{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
</style></head><body>
<main>
<h1>Teyzem için</h1>
<div class="sub">Bugün ne oynamak istersin? 💕</div>
<a class="card" href="kalp-yagmuru.html"><div class="ic">🫖</div><div><b>Kalp Yağmuru</b><span>Çay bardağıyla kalpleri yakala. 10 bölüm!</span></div></a>
<a class="card" href="hafiza.html"><div class="ic">🌷</div><div><b>Hafıza Bahçesi</b><span>Kartları eşleştir, her eşleşmede bir iltifat kazan.</span></div></a>
<a class="card" href="iksir.html"><div class="ic">🧪</div><div><b>Sevgi İksirleri</b><span>İksirleri renklerine göre ayır. 30 seviye!</span></div></a>
<button class="card" id="open"><div class="ic">☕</div><div><b>Sevgi Falı</b><span>Fincanı salla, falına ne çıkacak bak.</span></div></button>
<button class="card gold" id="mopen"><div class="ic">🪞</div><div><b>Dünyanın en güzel teyzesini görmek için tıkla</b><span>Dikkat: çok güzel biri çıkabilir 😄</span></div></button>
<div class="foot">Seni seviyorum <span id="n"></span> ❤️</div>
</main>
<div id="fal" role="dialog" aria-label="Sevgi falı">
<button id="cup" aria-label="Fincanı salla">☕</button>
<div id="ft">Fincana dokun ve salla!</div>
<div><button class="go" id="again" hidden>Bir daha bak</button><button class="go s" id="close">Kapat</button></div>
</div>
<div id="mir" role="dialog" aria-label="Sihirli ayna">
<div class="mf"><canvas id="mcv"></canvas><video id="mvid" playsinline muted autoplay></video>
<span class="sp" style="left:-14px;top:12%">✨</span><span class="sp" style="right:-14px;top:30%;animation-delay:.6s">💖</span><span class="sp" style="left:-10px;bottom:14%;animation-delay:1.2s">🌷</span><span class="sp" style="right:-8px;bottom:6%;animation-delay:1.8s">✨</span></div>
<div id="mcap"></div><button class="go s" id="mclose">Kapat</button>
</div>
<script src="ayar.js"></script>
<script>
const $=id=>document.getElementById(id);
$('n').textContent=ISIM;
for(let i=0;i<12;i++){const s=document.createElement('span');s.className='fl';s.textContent=['❤️','🌷','💕','✨'][i%4];s.style.left=Math.random()*100+'vw';s.style.fontSize=(18+Math.random()*18)+'px';s.style.animationDuration=(9+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*14)+'s';document.body.appendChild(s)}
const FAL=['Falında büyük bir mutluluk görünüyor. Sevdiklerin hep yanında olacak.','Yakında bir misafir geliyor. Aslında o misafir benim 😄','Kalbinde taşıdığın sevgi sana kat kat geri dönecek.','Bir yolculuk görünüyor, sonunda koca bir sarılma var.','Fincanda bir kalp var, tam ortada. O kalp senin.','Güzel bir haber yolda. Yüzün hep gülecek.','Sağlığın hep yerinde, evin bereketli olacak.','Bir çay daha iç, falında şans görünüyor ☕','Yıldızın parlıyor. Bu yıl çok güzel şeyler olacak.','Fincanda bir kuş var: huzur ve mutluluk getiriyor.','Biri seni çok özlüyor ve çok seviyor. Tahmin et kim?','Bir sofra kuruluyor, etrafında herkes mutlu, ortasında sen.','Yolun hep açık olsun, duaların kabul olsun.','Falın güzel çıktı: sevgi, sağlık, huzur ve neşe.','Bir tatlı sürpriz yaklaşıyor, hazır ol!','Fincanın dibinde "Seni seviyorum '+ISIM+'" yazıyor ❤️'];
let b=[],busy=0;const next=()=>{if(!b.length)b=FAL.slice().sort(()=>Math.random()-.5);return b.pop()};
function reset(){$('ft').textContent='Fincana dokun ve salla!';$('again').hidden=true}
function shake(){if(busy)return;busy=1;$('again').hidden=true;$('ft').textContent='Fal bakılıyor...';$('cup').classList.add('sh');
 setTimeout(()=>{$('cup').classList.remove('sh');$('ft').textContent=next();$('again').hidden=false;busy=0},1400)}
$('open').onclick=()=>{reset();$('fal').classList.add('on');$('cup').focus()};
$('close').onclick=()=>$('fal').classList.remove('on');
$('cup').onclick=shake;$('again').onclick=shake;

const MC=['Dünyanın en güzel teyzesi burada! 👑','Maşallah, ne kadar güzelsin!','Gülüşün her şeye yeter ✨','Işıl ışıl parlıyorsun 💖','Hiç değişme, böyle güzel kal!','Aynadaki kişi çok sevilen biri '+ISIM+' 💕','Gözlerin yıldız gibi parlıyor','Seni seviyorum '+ISIM+' ❤️'];
const WARN='Kamera karanlık görünüyor 😔\nKamera kapağını, ışığı ve başka uygulamayı kontrol et.';
let ms,mi,raf,dark=0,tk=0,ck=0;
const bc=document.createElement('canvas');bc.width=bc.height=16;
function drawMirror(){
 const cv=$('mcv'),v=$('mvid'),d=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
 if(w&&cv.width!==Math.round(w*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
 const x=cv.getContext('2d'),rx=w/2,ry=h/2,T=Math.PI*2;
 x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);
 x.save();x.beginPath();x.ellipse(rx,ry,rx-9,ry-9,0,0,T);x.clip();
 x.fillStyle='#1b0615';x.fillRect(0,0,w,h);
 if(v.videoWidth){const s=Math.max(w/v.videoWidth,h/v.videoHeight),dw=v.videoWidth*s,dh=v.videoHeight*s;x.translate(w,0);x.scale(-1,1);x.drawImage(v,(w-dw)/2,(h-dh)/2,dw,dh)}
 x.restore();
 const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff1c2');g.addColorStop(.35,'#d9a43a');g.addColorStop(.55,'#fff1c2');g.addColorStop(1,'#b8801f');
 x.lineWidth=12;x.strokeStyle=g;x.beginPath();x.ellipse(rx,ry,rx-6,ry-6,0,0,T);x.stroke();
 x.lineWidth=2;x.strokeStyle='#8a5d16';x.beginPath();x.ellipse(rx,ry,rx-12,ry-12,0,0,T);x.stroke();
 raf=requestAnimationFrame(drawMirror);
}
function bright(){try{const x=bc.getContext('2d');x.drawImage($('mvid'),0,0,16,16);const p=x.getImageData(0,0,16,16).data;let t=0;for(let i=0;i<p.length;i+=4)t+=p[i]+p[i+1]+p[i+2];return t/768}catch(e){return 99}}
const cap=t=>$('mcap').textContent=t;
function tick(){
 tk++;const d=bright()<6;
 if(d){if(tk>=2&&!dark){dark=1;cap(WARN)}return}
 if(dark){dark=0;ck=(ck+1)%MC.length;cap(MC[ck]);tk=0;return}
 if(tk===1||tk%3===0){ck=(ck+1)%MC.length;cap(MC[ck])}
}
async function openMirror(){
 $('mir').classList.add('on');cap('Aynaya bak...');dark=0;tk=0;ck=Math.floor(Math.random()*MC.length);
 cancelAnimationFrame(raf);drawMirror();
 try{
  ms=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  $('mvid').srcObject=ms;await $('mvid').play();
  clearInterval(mi);mi=setInterval(tick,1000);
 }catch(e){cap('Kamera açılamadı 😔\nTarayıcıdan kamera iznini verip tekrar dene.')}
}
function closeMirror(){clearInterval(mi);cancelAnimationFrame(raf);if(ms)ms.getTracks().forEach(t=>t.stop());ms=null;$('mvid').srcObject=null;$('mir').classList.remove('on')}
$('mopen').onclick=openMirror;$('mclose').onclick=closeMirror;
</script></body></html>
